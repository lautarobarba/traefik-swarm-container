services:
  traefik:
    image: traefik:v3.1

    command:
      - --configFile=/etc/traefik/traefik.yml

    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: host

      - target: 443
        published: 443
        protocol: tcp
        mode: host

      - target: 8080
        published: 8080
        protocol: tcp
        mode: host

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /home/lautaro/Desarrollo/traefik-swarm-container/traefik.yml:/etc/traefik/traefik.yml:ro
      - /home/lautaro/Desarrollo/traefik-swarm-container/dynamic:/etc/traefik/dynamic:ro
      - /home/lautaro/Desarrollo/traefik-swarm-container/letsencrypt:/letsencrypt

    networks:
      - traefik-network

    deploy:
      placement:
        constraints:
          - node.role == manager

      restart_policy:
        condition: any

      labels:
        - traefik.enable=true

        # Dashboard
        - traefik.http.routers.traefik.rule=Host(`traefik.midominio.com`)
        - traefik.http.routers.traefik.service=api@internal
        - traefik.http.routers.traefik.entrypoints=websecure
        - traefik.http.routers.traefik.tls.certresolver=letsencrypt

networks:
  traefik-network:
    external: true
