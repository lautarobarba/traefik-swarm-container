services:
  traefik:
    image: traefik:v3.7

    command:
      - --configFile=/etc/traefik/traefik.yml

    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: host

      - target: 443
        published: 443
        protocol: tcp
        mode: host

      - target: 8080
        published: 8080
        protocol: tcp
        mode: host

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /mnt/fake_nfs/media/traefik/data/traefik.yml:/etc/traefik/traefik.yml:ro
      - /mnt/fake_nfs/media/traefik/data/dynamic:/etc/traefik/dynamic:ro
      - /mnt/fake_nfs/media/traefik/data/certs:/certs:ro
      - /mnt/fake_nfs/media/traefik/data/letsencrypt:/letsencrypt

    networks:
      - traefik-network

    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

      restart_policy:
        condition: any

      labels:
        - traefik.enable=true

networks:
  traefik-network:
    external: true
