services:
  traefik:
    image: traefik:v3.7.6

    command:
      - --configFile=/etc/traefik/traefik.yml

    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: host

      - target: 443
        published: 443
        protocol: tcp
        mode: host

      - target: 8080
        published: 8080
        protocol: tcp
        mode: host

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_config:/etc/traefik:ro
      - traefik_certs:/certs:ro
      - traefik_letsencrypt:/letsencrypt

    networks:
      - traefik_network

    deploy:
      mode: global
      # placement:
      #   constraints:
      #     - node.role == manager

      restart_policy:
        condition: any

      labels:
        - traefik.enable=true

networks:
  traefik_network:
    external: true

volumes:
  # Reemplazar addr=127.0.0.1 para pruebas locales
  traefik_config:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=127.0.0.1,ro,nfsvers=4"
      device: ":/srv/nfs/traefik/data"
  traefik_certs:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=127.0.0.1,ro,nfsvers=4"
      device: ":/srv/nfs/traefik/data/certs"
  traefik_letsencrypt:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=127.0.0.1,rw,nfsvers=4"
      device: ":/srv/nfs/traefik/data/letsencrypt"
